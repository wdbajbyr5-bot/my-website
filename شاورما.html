
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المنيو</title>

<style>

/* =========================
   الصفحة
========================= */

body{
  margin:0;
  font-family:Tahoma, sans-serif;
  background:#111;
  color:#eee;
}


/* =========================
   الهيدر
========================= */

header{
  background:#000;
  color:#ff7a00;
  padding:20px;
  text-align:center;
  border-bottom:3px solid #ff7a00;
}

header img{
  width:90px;
  margin-bottom:10px;
}


/* =========================
   القائمة العلوية
========================= */

nav{
  background:#1a1a1a;
  display:flex;
  justify-content:center;
  gap:30px;
  padding:12px;
  border-bottom:2px solid #ff7a00;
}

nav a{
  color:#ff7a00;
  text-decoration:none;
  font-weight:bold;
  font-size:18px;
}


/* =========================
   قسم المنيو
========================= */

.section{
  padding:40px 20px;
  max-width:1100px;
  margin:auto;
  text-align:center;
}

.section h2{
  color:#ff7a00;
}


/* =========================
   الكروت
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:22px;
  margin-top:20px;
}

.card{
  background:#1a1a1a;
  border:2px solid #ff7a00;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.card img{
  width:100%;
  height:270px;
  object-fit:cover;
  border-radius:10px;
}

.card h3{
  color:#ff7a00;
  margin:10px 0;
}

.card p{
  font-size:18px;
}


/* =========================
   رابط أضف للسلة
========================= */

.card a{
  color:#b99878;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
}

.card a:hover{
  color:#ff7a00;
}


/* =========================
   السلة
========================= */

#cart{
  display:none;
  padding:20px;
  max-width:900px;
  margin:auto;
}

#cart h2{
  color:#ff7a00;
}


/* المنتجات داخل السلة */

#cart-items div{
  background:#ff7a00;
  color:#000;

  padding:10px;
  margin-bottom:8px;

  border-radius:6px;

  display:flex;
  align-items:center;
  gap:10px;
}

#cart-items img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
}


/* =========================
   أزرار الكمية
========================= */

.qty-btn{
  width:28px;
  height:28px;

  background:#1a1a1a;
  color:#ff7a00;

  border:none;
  border-radius:4px;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;
}

.qty-btn:hover{
  background:#ff7a00;
  color:#000;
}


/* =========================
   زر الحذف
========================= */

.remove-btn{
  background:#000;
  border:none;

  padding:5px 10px;

  border-radius:6px;

  cursor:pointer;

  color:white;
  font-size:18px;
}

.remove-btn::after{
  content:"❌";
}


/* =========================
   زر الرجوع
========================= */

.btn{
  padding:12px 25px;

  background:#ff7a00;
  color:#000;

  border:none;
  border-radius:8px;

  cursor:pointer;

  font-size:18px;
}


/* =========================
   السلة العائمة
========================= */

.floating-cart{

  position:fixed;

  bottom:15px;
  left:20px;

  width:70px;
  height:70px;

  background:#ff7a00;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  cursor:pointer;

  box-shadow:0 0 10px rgba(0,0,0,0.5);

  z-index:1000;
}


/* رقم السلة */

#cart-count{

  position:absolute;

  top:-5px;
  right:-5px;

  background:red;
  color:white;

  border-radius:50%;

  padding:3px 8px;

  font-size:14px;
}


/* =========================
   الفوتر
========================= */

footer{
  background:#000;
  color:#ff7a00;

  padding:15px;
  margin-top:30px;

  text-align:center;
}

</style>

</head>


<body>


<!-- =========================
     الهيدر
========================= -->

<header>

  <img src="images/ppp.jpg" alt="logo">

  <h1>قائمة الطعام</h1>

</header>


<!-- =========================
     القائمة العلوية
========================= -->

<nav>

  <a href="index.html">الرئيسية</a>

  <a href="Untitled-2.html">المنيو</a>

  <a href="pages2.html">تواصل معنا</a>

</nav>



<!-- =========================
     المنيو
========================= -->

<div id="menu">

<section class="section">

  <h2>أصناف الشاورما</h2>


  <div class="grid">




    <!-- =====================
         المنتج الثاني
    ====================== -->

    <div class="card">

      <img
        src="images/h2.jpg"
        alt="شاورما دجاج"
      >

      <h3>شاورما دجاج</h3>

      <p>
        <b>1000 ريال</b>
      </p>

      <a
        href="#"
        onclick="addToCart(
          'شاورما دجاج',
          1000,
          'images/h2.jpg'
        ); return false;"
      >
        أضف للسلة
      </a>

    </div>



    <!-- =====================
         المنتج الثالث
    ====================== -->

    <div class="card">

      <img
        src="images/h.jpg"
        alt="شاورما لحم  "
      >

      <h3>شاورما لحم</h3>

      <p>
        <b>2000 ريال</b>
      </p>

      <a
        href="#"
        onclick="addToCart(
        'شاورما لحم',
          2000,
          'images/h.jpg'
        ); return false;"
      >
        أضف للسلة
      </a>

    </div>


  </div>

</section>

</div>



<!-- =========================
     السلة
========================= -->

<div id="cart">

  <h2>🛒 السلة</h2>

  <div id="cart-items"></div>

  <h3 id="total">
    الإجمالي: 0 ريال
  </h3>

  <button
    class="btn"
    onclick="backToMenu()"
  >
    رجوع للمنيو ↪️
  </button>
  <button
  class="btn"
  onclick=" window.location.href='pages2.html'"
>
  اتمام الطلب
  🛒
</button>

</div>



<!-- =========================
     السلة العائمة
========================= -->

<div
  class="floating-cart"
  onclick="openCart()"
>

  🛒

  <span id="cart-count">
    0
  </span>

</div>



<script>

/* =================================================
   قراءة السلة المحفوظة
================================================= */

let cart =
  JSON.parse(localStorage.getItem("cart")) || [];



/* =================================================
   إضافة منتج للسلة
================================================= */

function addToCart(name, price, img){

  let existing =
    cart.find(item => item.name === name);


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:name,

      price:price,

      img:img,

      qty:1

    });

  }


  /* حفظ السلة */

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  /* تحديث الرقم */

  updateCartCount();


  /* رسالة التأكيد */

  alert("تمت الإضافة للسلة ✔️");

}



/* =================================================
   تحديث رقم السلة
================================================= */

function updateCartCount(){

  let count =
    cart.reduce(
      (total,item) => total + item.qty,
      0
    );


  document.getElementById(
    "cart-count"
  ).innerText = count;

}



/* =================================================
   فتح السلة
================================================= */

function openCart(){

  /*
     مهم:
     هذه الدالة لا تضيف أي منتج.
     فقط تفتح السلة وتعرض الموجود.
  */


  document.getElementById(
    "menu"
  ).style.display = "none";


  document.getElementById(
    "cart"
  ).style.display = "block";


  showCart();

}



/* =================================================
   عرض المنتجات الموجودة
================================================= */

function showCart(){

  let list = "";

  let total = 0;


  /* إذا كانت السلة فارغة */

  if(cart.length === 0){

    list = `
      <p>
        🛒 السلة فارغة
      </p>
    `;

  }


  /* إذا فيها منتجات */

  else{

    cart.forEach(
      (item,index) => {

        list += `

          <div>

            <img
              src="${item.img}"
              alt="${item.name}"
            >

            <span style="flex:1">

              ${item.name}

              -

              ${item.price}

              ريال

            </span>


            <button
              class="qty-btn"
              onclick="changeQty(${index},-1)"
            >
              −
            </button>


            <span>

              ${item.qty}

            </span>


            <button
              class="qty-btn"
              onclick="changeQty(${index},1)"
            >
              +
            </button>


            <button
              class="remove-btn"
              onclick="removeItem(${index})"
            >
            </button>

          </div>

        `;


        total +=
          item.price * item.qty;

      }
    );

  }


  /* عرض المنتجات */

  document.getElementById(
    "cart-items"
  ).innerHTML = list;


  /* عرض الإجمالي */

  document.getElementById(
    "total"
  ).innerText =
    "الإجمالي: " +
    total +
    " ريال";

}



/* =================================================
   حذف منتج
================================================= */

function removeItem(index){

  cart.splice(index,1);


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartCount();


  showCart();

}



/* =================================================
   تغيير الكمية
================================================= */

function changeQty(index, delta){

  cart[index].qty += delta;


  /* إذا صارت الكمية صفر */

  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartCount();


  showCart();

}



/* =================================================
   الرجوع للمنيو
================================================= */

function backToMenu(){

  document.getElementById(
    "cart"
  ).style.display = "none";


  document.getElementById(
    "menu"
  ).style.display = "block";

}



/* =================================================
   تشغيل الرقم عند فتح الصفحة
================================================= */

updateCartCount();


 

</script>


</body>

</html>
